name: Android CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Fetch pinned Android Xray core AAR
        run: |
          mkdir -p app/libs
          curl --fail --location --retry 3 --output app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.10.29/libv2ray.aar
          echo "64fc529302dce728bde859f45d87a64f7289a5fbcca8ef962aae3d94c6e3fa82  app/libs/libv2ray.aar" | sha256sum --check
      # GitHub-hosted Android runners already include the Android SDK.
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: aura-vpn-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
